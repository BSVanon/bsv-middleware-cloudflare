[package]
name = "bsv-middleware-core"
version = "0.3.0"
edition = "2021"
description = "Runtime-free BSV BRC-103/104 authentication and BRC-29 payment verification: the pure rules behind bsv-middleware-cloudflare"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Calhooon/bsv-middleware-cloudflare"
keywords = ["bsv", "authentication", "payment", "spv", "middleware"]
categories = ["authentication", "cryptography"]
readme = "README.md"

[lib]
crate-type = ["rlib"]

[dependencies]
# BSV SDK: keys, BRC-42 derivation, BRC-103 message types, BEEF and merkle paths.
# No `wasm` feature here: the host crate turns it on for a wasm32 build.
bsv-sdk = { package = "bsv-rs", version = "0.5.0", features = ["auth", "wallet", "transaction"] }

async-trait = "0.1"

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
hex = "0.4"

# Entropy for per-message nonces (the OS source; `js` is the host's choice on wasm32).
getrandom = "0.2"

# The session lane's MAC and digests; `ripemd` only for the refund signer's hash160.
sha2 = "0.10"
hmac = "0.12"
ripemd = { version = "0.1", optional = true }

[features]
default = []
# `refund`: the BRC-29 refund signer (`refund::signer`) and refund key derivation.
refund = ["ripemd"]

[package.metadata.docs.rs]
all-features = true

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros"] }
