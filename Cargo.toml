[package]
name = "bsv-middleware-cloudflare"
version = "0.7.1"
edition = "2021"
rust-version = "1.88"
description = "BSV BRC-103/104 authentication and BRC-29 payment middleware for Cloudflare Workers"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Calhooon/bsv-middleware-cloudflare"
keywords = ["bsv", "authentication", "cloudflare", "workers", "middleware"]
categories = ["web-programming", "authentication", "cryptography"]
include = ["Cargo.toml", "README.md", "CHANGELOG.md", "LICENSE-*", "src/**/*.rs", "tests/**", "conformance/**", "examples/*.rs"]

[workspace]
members = [".", "core"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# The runtime-free rules this crate adapts to Workers (same repository, `core/`).
bsv-middleware-core = { version = "0.4.0", path = "core" }

# Cloudflare Workers
worker = "0.8"

# BSV SDK
bsv-sdk = { package = "bsv-rs", version = "0.7.0", features = ["auth", "wallet", "transaction", "wasm"] }

# Async
futures = "0.3"
wasm-bindgen-futures = "0.4"
async-trait = "0.1"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Encoding
hex = "0.4"
base64 = "0.22"

# Error handling
thiserror = "1.0"

# WASM utilities
console_error_panic_hook = "0.1"
wasm-bindgen = "0.2"
js-sys = "0.3"

# Random
getrandom = { version = "0.2", features = ["js"] }
rand = "0.8"

[features]
default = []
refund = ["bsv-middleware-core/refund"]
# `payment_claims`: atomic single-use payment-nonce claims on a D1 table.
d1-claims = ["worker/d1"]

[package.metadata.docs.rs]
all-features = true

[dev-dependencies]
rusqlite = { version = "0.38", default-features = false, features = ["bundled"] }
tokio = { version = "1", features = ["rt", "macros"] }

[profile.release]
opt-level = "s"
lto = true
