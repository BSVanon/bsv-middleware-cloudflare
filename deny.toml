[graph]
all-features = true

[advisories]
db-path = "$CARGO_HOME/advisory-dbs"
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"

[licenses]
allow = ["MIT", "Apache-2.0", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Unicode-DFS-2016", "Unicode-3.0", "Zlib"]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
# Wrappers are immediate parents, not an exemption for bsv-rs's whole subtree.
# Re-read and re-stamp this list when the line's bsv-rs pin moves.
deny = [
    # bsv-rs 0.7.0: bsv-rs, k256, p256.
    { name = "sha2", wrappers = ["bsv-rs", "k256", "p256"], reason = "Use bsv-rs hashing" },
    # bsv-rs 0.7.0: bsv-rs.
    { name = "ripemd", wrappers = ["bsv-rs"], reason = "Use bsv-rs hashing" },
    # bsv-rs 0.7.0: secp256k1 absent; retain bsv-rs alone.
    { name = "secp256k1", wrappers = ["bsv-rs"], reason = "Use bsv-rs keys and signatures" },
    # bsv-rs 0.7.0: bsv-rs.
    { name = "k256", wrappers = ["bsv-rs"], reason = "Use bsv-rs keys and signatures" },
    # bsv-rs 0.7.0: bsv-rs.
    { name = "bs58", wrappers = ["bsv-rs"], reason = "Use bsv-rs base58check" },
    # bsv-rs 0.7.0: bsv-rs, pbkdf2, rfc6979.
    { name = "hmac", wrappers = ["bsv-rs", "pbkdf2", "rfc6979"], reason = "Use bsv-rs HMAC" },
    # bsv-rs 0.7.0: bsv-rs.
    { name = "p256", wrappers = ["bsv-rs"], reason = "Use bsv-rs keys and signatures" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
